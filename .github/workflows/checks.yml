name: Core checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      final_qa:
        description: 'Run the database/WordPress integration baseline for Final QA'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, mbstring, sodium, gd
      - run: bash scripts/lint-php.sh
      - run: php tests/basic/frontend-routing.php
      - run: php tests/basic/management-integrity.php
      - run: php tests/basic/public-search.php
      - run: php tests/basic/editorial-search.php
      - run: php tests/basic/editorial-management.php
      - run: php tests/basic/forms-management.php
      - run: php tests/basic/seo.php
      - run: php tests/basic/sitemap.php
      - run: php tests/basic/github-client.php
      - run: php tests/basic/github-discovery.php
      - run: php tests/basic/skill-parser.php
      - run: php tests/basic/import-store.php
      - run: php tests/basic/import-admin.php
      - run: php tests/basic/import-worker.php
      - run: php tests/basic/ai-provider.php
      - run: php tests/basic/ai-content.php
      - run: php tests/basic/ai-source.php
      - run: php tests/basic/ai-store.php
      - run: php tests/basic/ai-admin.php
      - run: php tests/basic/ai-worker.php
      - run: php tests/basic/database-transactions.php
      - run: php tests/basic/migration-recovery.php
      - run: php tests/basic/language-adapter.php
      - run: php tests/basic/editorial-projections.php
      - run: php tests/basic/seo-failures.php
      - run: php tests/basic/admin-settings.php
      - run: php tests/basic/import-scheduler.php
      - run: php tests/basic/ai-locks.php
      - run: php tests/basic/frontend-locks.php
      - name: Account security and mail contracts (isolated/Mock)
        run: |
          for test in tests/basic/account-*.php; do php "$test"; done
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:assets
      - run: python3 tests/final/test-package-theme.py
      - run: python3 scripts/package-theme.py --check
  wordpress-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.final_qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run check:assets
      - name: Generate temporary development credentials
        run: |
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          Path('.env').write_text('MYSQL_DATABASE=ai_skills_hub\nMYSQL_USER=aish\nMYSQL_PASSWORD=' + secrets.token_hex(24) + '\nMYSQL_ROOT_PASSWORD=' + secrets.token_hex(24) + '\n')
          Path('.env').chmod(0o600)
          password = Path(os.environ['RUNNER_TEMP']) / 'aish-admin-password'
          admin_password = secrets.token_hex(24)
          print('::add-mask::' + admin_password)
          password.write_text(admin_password + '\n')
          password.chmod(0o600)
          PY
      - run: docker compose up -d --wait mysql wordpress
      - name: Install development WordPress and activate theme
        run: |
          python3 scripts/install-wordpress.py --password-file "$RUNNER_TEMP/aish-admin-password"
          docker compose run --rm -T cli wp theme activate ai-skills-hub
      - run: npm run lint:php && npm run test:core && npm run smoke:wp
      - name: Record runtime versions
        run: |
          docker compose exec -T wordpress php -v
          docker compose exec -T mysql mysql --version
          docker compose run --rm -T cli wp core version
      - name: Stop temporary test containers
        if: always()
        run: docker compose down
