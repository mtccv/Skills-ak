<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>设计评审预览 · AI Skills Hub</title><link rel="stylesheet" href="assets/prototype.css"><script defer src="assets/preview.js"></script></head>
<body class="bg-canvas"><header class="border-b border-line bg-white p-4"><div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-4"><div><h1 class="text-lg font-bold">AI Skills Hub · 设计评审 / Design review</h1><p class="mt-1 text-xs text-muted">静态示例，无业务请求与数据保存。Static demo; no live data or persistence.</p></div><a href="index.html" class="btn btn-secondary">返回原型 / Open prototype</a></div></header><main class="mx-auto max-w-[1600px] p-4 md:p-6"><form id="preview-controls" class="panel mb-5 flex flex-wrap items-end gap-4 p-4"><label class="text-sm font-semibold">页面 / Page<select class="input mt-2" name="page"><option value="home">首页 / Home</option><option value="skills">Skills</option><option value="skill">详情 / Detail</option><option value="dashboard">用户中心 / User dashboard</option><option value="admin">后台 / WP admin</option></select></label><label class="text-sm font-semibold">语言 / Language<select class="input mt-2" name="lang"><option value="zh">中文</option><option value="en">English</option></select></label><label class="text-sm font-semibold">画布 / Viewport<select class="input mt-2" name="width"><option value="1440">Desktop · 1440 px</option><option value="768">Tablet · 768 px</option><option value="390">Mobile · 390 px</option><option value="360">Small mobile · 360 px</option></select></label><label class="text-sm font-semibold">状态 / State<select class="input mt-2" name="state"><option value="default">默认 / Default</option><option value="loading">加载 / Loading</option><option value="empty">空 / Empty</option><option value="error">错误 / Error</option><option value="missing">缺译 / Missing translation</option></select></label></form><p class="mb-3 text-xs text-muted">画布保持所选的真实 CSS 像素宽度；空间不足时可横向滚动。The iframe retains the selected viewport width; scroll horizontally if needed.</p><div class="overflow-x-auto rounded-2xl border border-line bg-slate-200 p-3"><iframe id="design-frame" title="AI Skills Hub static design viewport" class="mx-auto block h-[900px] max-w-none rounded-xl border-0 bg-white" width="1440" src="index.html?embed=1&amp;lang=zh"></iframe></div><p id="preview-description" class="mt-3 text-xs text-muted" role="status"></p></main></body></html>
